<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account - Code Sentinels WLB</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand big">Code Sentinels</div>
    <p class="muted">Create an employee account to take assessments.</p>
    <form id="regForm" autocomplete="on">
      <label for="full_name">Full name</label>
      <input id="full_name" name="full_name" type="text" required minlength="2" autofocus>

      <label for="username">Username</label>
      <input id="username" name="username" type="text" required minlength="3"
             pattern="[A-Za-z0-9._\-]{3,40}"
             title="Letters, digits, . _ - (3-40 chars)" autocomplete="username">

      <label for="email">Email (optional)</label>
      <input id="email" name="email" type="email" autocomplete="email">

      <label for="department">Department</label>
      <input id="department" name="department" type="text" value="General" required>

      <label for="designation">Designation (optional)</label>
      <input id="designation" name="designation" type="text">

      <label for="password">Password (min 8 characters, letters and digits)</label>
      <input id="password" name="password" type="password" required minlength="8"
             autocomplete="new-password">

      <label for="password2">Confirm password</label>
      <input id="password2" name="password2" type="password" required autocomplete="new-password">

      <div id="err" class="error" role="alert" hidden></div>
      <button class="btn-primary wide" id="regBtn" type="submit">Create account</button>
    </form>
    <p class="muted small" style="margin-top:14px">
      Already have an account? <a href="/login.html">Sign in</a>
    </p>
    <p class="muted small">
      Need an HR or admin account? Ask your administrator to create one for you.
    </p>
  </main>
  <script src="register.js"></script>
</body>
</html>
